name: Déploiement Portfolio V6 (Astro + Archives)

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Astro V6, Audit Quality & Assemble Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: versions/V6/package-lock.json

      - name: Install V6 dependencies
        working-directory: versions/V6
        run: npm ci

      - name: Cache Playwright Chromium binaries
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('versions/V6/package-lock.json') }}

      - name: Install Playwright Chromium for CV PDF generation, E2E & WCAG 2.1 AA audit
        working-directory: versions/V6
        run: npx playwright install --with-deps chromium

      - name: Sync GitHub portfolio catalog & WebP previews
        working-directory: versions/V6
        run: npm run portfolio:sync

      - name: Typecheck Astro (astro check)
        working-directory: versions/V6
        run: npm run check

      - name: Build Astro static output
        working-directory: versions/V6
        run: npm run build

      - name: Assemble root, archives V1..V5 & V6 build
        working-directory: versions/V6
        run: npm run site:assemble

      - name: Generate CV PDFs (FR & EN) from /resume single source of truth
        working-directory: versions/V6
        run: npm run cv:pdf

      - name: Auto-commit synced GitHub catalog, WebP previews & CV PDFs on cron/manual run
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions/V6/public/assets/data/github-projects.json versions/V6/public/assets/images/projects/github versions/V6/public/assets/docs/cv-fr.pdf versions/V6/public/assets/docs/cv-en.pdf
          if ! git diff --cached --quiet; then
            git commit -m "chore(v6): auto-sync GitHub portfolio catalog, WebP previews & CV PDFs [skip ci]"
            git push origin HEAD:main
          fi

      - name: Verify archive integrity & internal links
        working-directory: versions/V6
        run: npm run site:links

      - name: Verify bundle size, asset & Lighthouse SEO budgets
        working-directory: versions/V6
        run: npm run site:budgets

      - name: Run Playwright E2E, Web Vitals & WCAG 2.1 AA accessibility tests
        working-directory: versions/V6
        run: npm run test:e2e

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: versions/V6/.site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
